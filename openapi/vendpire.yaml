openapi: 3.1.0
info:
  title: Vendpire
  description: Sync surface for the Vendpire iOS app. Mirrors procedures the web
    dashboard calls over tRPC.
  version: 1.0.0
servers:
  - url: http://localhost:3210/api/v1
paths:
  /me:
    get:
      operationId: auth-me
      summary: The signed-in principal; orgId is null without an active org
      tags:
        - auth
      security:
        - bearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        "401": &a2
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.UNAUTHORIZED"
        "403": &a3
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.FORBIDDEN"
        "500": &a1
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.INTERNAL_SERVER_ERROR"
  /client-support:
    get:
      operationId: system-clientSupport
      summary: Whether this iOS build is still supported
      tags:
        - system
      parameters:
        - in: query
          name: platform
          schema:
            type: string
            const: ios
          required: true
        - in: query
          name: build
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          required: true
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSupport"
        "400": &a4
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.BAD_REQUEST"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.NOT_FOUND"
        "500": *a1
  /locations:
    get:
      operationId: locations-list
      summary: Every location in the organization
      tags:
        - locations
      security:
        - bearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
        "401": *a2
        "403": *a3
        "500": *a1
  /machines:
    get:
      operationId: machines-list
      summary: Every machine in the organization
      tags:
        - machines
      security:
        - bearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Machine"
        "401": *a2
        "403": *a3
        "500": *a1
  /products:
    get:
      operationId: products-list
      summary: Every product in the organization
      tags:
        - products
      security:
        - bearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401": *a2
        "403": *a3
        "500": *a1
  /planograms/current:
    get:
      operationId: planograms-listCurrentByOrg
      summary: The current planogram for every machine in the organization
      tags:
        - planograms
      security:
        - bearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Planogram"
        "401": *a2
        "403": *a3
        "500": *a1
  /purchases:
    post:
      operationId: purchases-create
      summary: Record one stock-buying run
      tags:
        - purchases
      security:
        - bearer: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purchasedAt:
                  $ref: "#/components/schemas/__schema0"
                vendor:
                  $ref: "#/components/schemas/__schema1"
                lines:
                  $ref: "#/components/schemas/__schema2"
                packLines:
                  $ref: "#/components/schemas/__schema3"
                receiptTotalCents:
                  $ref: "#/components/schemas/__schema4"
                notes:
                  $ref: "#/components/schemas/__schema5"
                clientRequestId:
                  $ref: "#/components/schemas/__schema6"
              required:
                - purchasedAt
                - vendor
                - clientRequestId
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purchase"
        "400": *a4
        "401": *a2
        "403": *a3
        "500": *a1
  /visits/latest:
    get:
      operationId: visits-listLatestByOrg
      summary: The latest visit for every machine in the organization
      tags:
        - visits
      security:
        - bearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visit"
        "401": *a2
        "403": *a3
        "500": *a1
  /visits:
    post:
      operationId: visits-create
      summary: Record a servicing of one machine
      description: "Idempotent on clientRequestId: a repeat submit returns the first
        visit rather than creating another."
      tags:
        - visits
      security:
        - bearer: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                machineId:
                  $ref: "#/components/schemas/__schema7"
                locationId:
                  $ref: "#/components/schemas/__schema8"
                planogramId:
                  $ref: "#/components/schemas/__schema9"
                countedAt:
                  $ref: "#/components/schemas/__schema10"
                lines:
                  $ref: "#/components/schemas/__schema11"
                notes:
                  $ref: "#/components/schemas/__schema22"
                clientRequestId:
                  $ref: "#/components/schemas/__schema23"
              required:
                - machineId
                - locationId
                - countedAt
                - lines
                - clientRequestId
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "400": *a4
        "401": *a2
        "403": *a3
        "500": *a1
  /packs:
    get:
      operationId: packs-list
      summary: Every pack in the organization
      tags:
        - packs
      security:
        - bearer: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pack"
        "401": *a2
        "403": *a3
        "500": *a1
