name: testflight

# Archives the iOS app and uploads it to TestFlight. Manual only: not every web
# release needs an iOS build.
#
# All of the build logic lives in `ios/Scripts/xc testflight`. This file only
# puts the signing material on the runner, so moving to another runner (a
# self-hosted Mac once the repo is private) means changing `runs-on`, or
# skipping the install steps on a machine that already has the cert. Never
# point a self-hosted runner at this repo while it is public.
on:
  workflow_dispatch:

# A cancelled upload can leave a half-processed build in App Store Connect.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    # Secrets live on the environment, so no other workflow can read them.
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # clerk-ios needs Swift tools 6.2, which only Xcode 26 ships.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      # xc defaults DEVELOPER_DIR to this Mac's path; use whatever setup-xcode picked.
      - name: Export the selected Xcode
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          keychainPassword="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychainPassword" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$keychainPassword" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          # Without this, codesign stops at a keychain access prompt nobody can click.
          security set-key-partition-list -S apple-tool:,apple: -k "$keychainPassword" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db"
          rm "$RUNNER_TEMP/dist.p12"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          profileDir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profileDir"
          echo "$PROFILE_BASE64" | base64 --decode > "$profileDir/zenvend-production.mobileprovision"

      - name: Install App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: ios/Scripts/xc testflight

      # Hosted runners are wiped anyway; a self-hosted one is not.
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/zenvend-production.mobileprovision"
